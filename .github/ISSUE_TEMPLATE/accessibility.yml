name: Accesibilidad o claridad
description: Ayúdanos a eliminar una barrera.
body:
  - type: textarea
    id: barrier
    attributes:
      label: Dónde encontraste la dificultad
      description: Página, tarea y barrera. Usa ejemplos sintéticos.
    validations:
      required: true
  - type: input
    id: technology
    attributes:
      label: Dispositivo, zoom o tecnología de apoyo (opcional)
  - type: textarea
    id: suggestion
    attributes:
      label: Qué te ayudaría a completar la tarea
