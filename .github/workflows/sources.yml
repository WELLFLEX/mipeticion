name: Source freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check
          path: reports/source-check.json
          retention-days: 30
